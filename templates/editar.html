<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto</title>
</head>

<body>

    <h1>Editar producto</h1>

    <form method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombre" value="{{ producto[1] }}" required>
        <br><br>

        <label>Precio:</label>
        <input type="number" name="precio" value="{{ producto[2] }}" min="0.01" step="0.01" required>
        <br><br>

        <label>Stock:</label>
        <input type="number" name="stock" value="{{ producto[3] }}" min="0" required>
        <br><br>

        <button type="submit">Guardar cambios</button>
    </form>

    <p><a href="/productos">Volver a productos</a></p>

</body>

</html>
